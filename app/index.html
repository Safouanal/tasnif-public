<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ouvrir Tasnif sur l'App Store</title>
    <meta name="description" content="Ouvrir Tasnif sur l'App Store.">
    <meta name="robots" content="noindex,follow">
    <meta name="apple-itunes-app" content="app-id=6771797577">
    <meta http-equiv="refresh" content="0; url=https://apps.apple.com/app/tasnif-photo-storage/id6771797577">
    <link rel="canonical" href="https://tasnif.app/app/">
    <link rel="stylesheet" href="../assets/seo.css">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon-32x32.png" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <script>
      const target = new URL("https://apps.apple.com/app/tasnif-photo-storage/id6771797577");
      const source = new URL(window.location.href);
      source.searchParams.forEach((value, key) => target.searchParams.set(key, value));
      window.location.replace(target.toString());
    </script>
  </head>
  <body>
    <main class="hero">
      <div class="hero-inner">
        <div class="hero-copy">
          <p class="eyebrow">App Store</p>
          <h1>Ouvrir Tasnif</h1>
          <p class="lead">Redirection vers l'App Store. Si rien ne se passe, ouvrez le lien officiel.</p>
          <div class="actions">
            <a class="button primary" href="https://apps.apple.com/app/tasnif-photo-storage/id6771797577" rel="noopener">Ouvrir l'App Store</a>
            <a class="button secondary" href="/">Retour au site</a>
          </div>
        </div>
        <figure class="phone"><img src="../assets/screenshots/fr-FR/iphone-library.jpg" alt="Tasnif sur iPhone." width="552" height="1200"></figure>
      </div>
    </main>
  </body>
</html>
